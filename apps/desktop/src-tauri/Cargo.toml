[package]
name = "app"
version = "0.11.0"
description = "Pasture desktop GUI for Codex"
authors = ["Anthony Crognale"]
license = "Apache-2.0"
repository = ""
edition = "2024"
rust-version = "1.90"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = [
  "protocol-asset",
  "macos-private-api",
] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-decorum = "1.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "fs",
] }
anyhow = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
ts-rs = { version = "11", features = ["serde-json-impl"] }
urlencoding = "2"
num_cpus = "1.16"
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
sea-orm-migration = { version = "1.1", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
] }
migration = { path = "migration" }
thiserror = "1"

codex-core = { path = "../../../codex/codex-rs/core" }
codex-otel = { path = "../../../codex/codex-rs/otel" }
codex-protocol = { path = "../../../codex/codex-rs/protocol" }
codex-apply-patch = { path = "../../../codex/codex-rs/apply-patch" }
codex-git = { path = "../../../codex/codex-rs/utils/git" }
codex-file-search = { path = "../../../codex/codex-rs/file-search" }
futures = "0.3"
ignore = "0.4"
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
async-trait = "0.1.89"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "app"
path = "src/main.rs"

[[bin]]
name = "ts-export"
path = "src/bin/ts_export.rs"
